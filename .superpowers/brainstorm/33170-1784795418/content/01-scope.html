<h2>功能范围选择</h2>
<p class="subtitle">mymore Memory Hub — 先划定边界</p>

<div class="options">
  <div class="option" data-choice="full" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>完整版 — 参考 EverMem</h3>
      <p>统计卡片 + 6 月热力图 + 7 日柱状图 + 记忆时间线 + 搜索/过滤</p>
    </div>
  </div>
  <div class="option" data-choice="timeline" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>时间线版 — 轻量起步</h3>
      <p>统计卡片 + 记忆时间线 + 搜索/过滤，不搞热力图和柱状图</p>
    </div>
  </div>
  <div class="option" data-choice="minimal" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>极简版 — 先跑起来</h3>
      <p>只有记忆时间线 + 搜索框，最简可用</p>
    </div>
  </div>
</div>
