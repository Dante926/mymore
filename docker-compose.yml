
services:
  mymore-mcp:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    image: mymore-mcp
    container_name: mymore-mcp
    restart: unless-stopped
    stdin_open: true
    tty: false
    volumes:
      - ~/.mymore:/root/.mymore
    environment:
      - MYMORE_ROOT=/root/.mymore

  mymore-hub:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    image: mymore-mcp
    container_name: mymore-hub
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ~/.mymore:/root/.mymore
    environment:
      - MYMORE_ROOT=/root/.mymore
      - MYMORE_HUB_PORT=3456
    command: ["node", "apps/mcp-server/dist/hub/server.js"]
